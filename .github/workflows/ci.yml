name: CI and ECR build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project and pinned upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.1'

      - name: Run upstream Go tests
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' module_file; do
            module_dir="${module_file%/go.mod}"
            echo "Testing $module_dir"
            # Google builds with `go build`; the Go 1.27 vet printf analyzer
            # rejects an existing upstream status.Errorf call. Keep upstream
            # unchanged and run the actual unit tests without the extra vet pass.
            (cd "$module_dir" && go test -vet=off ./...)
          done < <(find application/upstream/src -name go.mod -print0)

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Run upstream cart service tests
        run: dotnet test application/upstream/src/cartservice/tests/cartservice.tests.csproj --configuration Release

      - name: Validate AWS Kustomize overlay
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kubectl https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl
          curl -fsSLo /tmp/kubectl.sha256 https://dl.k8s.io/release/v1.36.0/bin/linux/amd64/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          chmod +x /tmp/kubectl
          cp application/upstream/release/kubernetes-manifests.yaml kubernetes/aws/online-boutique/upstream-manifests.generated.yaml
          /tmp/kubectl kustomize kubernetes/aws/online-boutique >/tmp/rendered-online-boutique.yaml

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out project and pinned upstream source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Assume the repository-scoped AWS role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::471623014584:role/online-boutique-dev-github-actions' }}
          aws-region: us-east-1
          allowed-account-ids: '471623014584'

      - name: Authenticate Docker to ECR
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          ECR_REGISTRY="${account_id}.dkr.ecr.us-east-1.amazonaws.com"
          echo "ECR_DEFAULT_REPO=${ECR_REGISTRY}/online-boutique-dev" >> "$GITHUB_ENV"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Install pinned Skaffold
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/skaffold https://storage.googleapis.com/skaffold/releases/v2.25.0/skaffold-linux-amd64
          chmod +x /tmp/skaffold
          sudo install -m 0755 /tmp/skaffold /usr/local/bin/skaffold
          skaffold version

      - name: Build upstream images and push immutable commit tags
        working-directory: application/upstream
        run: |
          set -euo pipefail
          skaffold build \
            --filename skaffold.yaml \
            --default-repo "$ECR_DEFAULT_REPO" \
            --tag "$GITHUB_SHA" \
            --disable-multi-platform-build
