apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: checkoutservice
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: checkoutservice
      spec:
        template:
          spec:
            containers:
              - name: server
                env:
                  - name: COLLECTOR_SERVICE_ADDR
                    value: otel-collector.monitoring.svc.cluster.local:4317
